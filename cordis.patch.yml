# dsh-reference-render bundle patch.
#
# Official install:
#
#   dsh plugin --profile <name> add dsh-reference-render@0.1.0
#
# The command appends this package to the profile bundle list and applies
# this file. Leave the profile's own cordis.patch.yml alone. A second insert
# of id `dsh-reference-render` is refused at boot (duplicate loader entry id).
#
# The client half loads from package.json `dsh.client`, not from a row here.
# Opening a reference goes through the host sidebarRight service. This patch
# does not draw or replace the right column.
- insert:
    - id: dsh-reference-render
      name: dsh-reference-render
